services:
  postgres:
    image: postgres:17-alpine
    container_name: it-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: it_tracker
    ports:
      - "5432:5432"
    volumes:
      - it_tracker_pgdata:/var/lib/postgresql/data

volumes:
  it_tracker_pgdata:
